<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex · Eraser Arena</title>
<meta name="description" content="Le Codex d'Eraser Arena : les héros, les dieux et les monstres du monde d'Eraser, chacun en carte.">
<meta name="theme-color" content="#141114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Cinzel:wght@600;700&family=Alegreya:ital@1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Page publique d'Eraser Arena : un en-tête, une barre de filtres, puis les cartes rangées par rareté.
   Même grimoire sombre que le Codex : suie, os, bronze, une trace d'acier froid. */
:root {
  color-scheme: dark;
  --soot: #141114; --ash: #1c181b; --ash-2: #262125; --line: #3a3236; --line-soft: #2c2629;
  --bone: #e6dccb; --bone-dim: #a99e90; --bone-faint: #8a7f77; --bronze: #c08a4e; --bronze-ink: #1a130c; --steel: #8fb0b2;
  --r-legendaire: #e3ad48; --r-epique: #a565ff; --r-superrare: #4a8bff; --r-rare: #3dbf72; --r-commune: #a9afb8; --r-trescommune: #7a7f88;
  --f-display: "IM Fell English SC", Georgia, serif;
  --f-card: "Cinzel", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html { background: var(--soot); }
body {
  margin: 0; color: var(--bone); font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse 90% 520px at 50% -120px, rgba(192,138,78,.16), transparent 70%), var(--soot);
  min-height: 100vh;
}
.wrap { max-width: 1240px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }

/* En-tête */
.hero { padding-block: clamp(40px, 8vw, 88px) 28px; display: grid; gap: 12px; justify-items: start; }
  .eyebrow a { color: var(--bronze); }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--steel); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(48px, 10vw, 104px); line-height: .92; margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--bronze); }
.lede { margin: 4px 0 0; max-width: 58ch; color: var(--bone-dim); font-size: 18px; font-style: italic; text-wrap: pretty; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; font-size: 14px; color: var(--bone-faint); }
.facts b { font-family: var(--f-mono); font-weight: 500; color: var(--bone); font-variant-numeric: tabular-nums; }

/* Filtres */
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 12px 0; margin-bottom: 8px; background: linear-gradient(var(--soot) 78%, rgba(20,17,20,0)); }
.bar input[type=search] { flex: 1 1 220px; min-width: 0; }
.bar input, .bar select { background: var(--ash); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; }
.bar select { flex: 0 1 260px; min-width: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: var(--ash); border: 1px solid var(--line); border-radius: 7px; }
.seg button { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; border-radius: 5px; padding: 6px 10px; color: var(--bone-dim); font-size: 14px; cursor: pointer; }
.seg button:hover { color: var(--bone); }
.seg button[aria-pressed="true"] { background: var(--ash-2); color: var(--bone); }
.seg .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px -1px var(--c); }
.count { font-size: 14px; color: var(--bone-faint); font-variant-numeric: tabular-nums; margin-left: auto; }
.reset { background: none; border: 0; color: var(--bronze); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; padding: 4px; }
/* Sur téléphone, la barre ne reste pas collée (elle mangerait l'écran) et les raretés défilent sur une ligne. */
@media (max-width: 720px) {
  .bar { position: static; background: none; gap: 8px; }
  .bar select { flex: 1 1 100%; }
  .seg { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .seg button { white-space: nowrap; flex: none; }
  .count { margin-left: 0; }
}

/* Cartes */
.group { margin-top: 26px; }
.group-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); }
.group-head h2 { font: 600 20px var(--f-card); letter-spacing: .06em; margin: 0; color: var(--c); }
.group-head span { font-family: var(--f-mono); font-size: 13px; color: var(--bone-faint); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 22px 16px; }
@media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; } }
.cell { display: grid; gap: 7px; min-width: 0; }
.thumb { position: relative; display: block; width: 100%; aspect-ratio: 512 / 716; padding: 0; border: 0; border-radius: 4.5%; cursor: zoom-in;
  background: linear-gradient(160deg, var(--ash-2), var(--ash)); overflow: hidden; }
.thumb canvas { width: 100%; height: 100%; display: block; }
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .thumb { transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s; }
  .thumb:hover { transform: translateY(-4px); box-shadow: 0 14px 30px -12px var(--glow, rgba(0,0,0,.6)); }
}
.cap { font-size: 13.5px; color: var(--bone-faint); text-align: center; line-height: 1.3; overflow-wrap: anywhere; }
.empty { padding: 60px 0; text-align: center; color: var(--bone-dim); }
.state { padding: 60px 0; color: var(--bone-dim); }

footer { margin-top: 64px; padding-block: 22px 40px; border-top: 1px solid var(--line-soft); color: var(--bone-faint); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 24px; }
footer a { color: var(--bone-dim); }

/* Carte en grand : un clic la retourne, les flèches passent à la suivante. */
dialog { border: 0; padding: 0; background: transparent; max-width: none; max-height: none; width: 100%; height: 100%; overflow: hidden; color: var(--bone); }
dialog::backdrop { background: rgba(6,5,8,.9); }
.stage { position: absolute; inset: 0; display: grid; place-items: center;
  padding: max(56px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(48px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.big { position: relative; height: min(80vh, calc((100vw - 32px) * 716 / 512)); aspect-ratio: 512 / 716; max-width: 100%; padding: 0; border: 0; background: none; cursor: pointer; perspective: 1600px; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 4.5%; overflow: hidden; }
.face canvas { width: 100%; height: 100%; display: block; }
.face.back { transform: rotateY(180deg); }
.big[aria-pressed="true"] .front { transform: rotateY(-180deg); }
.big[aria-pressed="true"] .back { transform: rotateY(0deg); }
@media (prefers-reduced-motion: no-preference) { .face { transition: transform .6s cubic-bezier(.2,.7,.2,1); } }
.pill { font: 600 14px var(--f-body); color: var(--bone); background: var(--ash); border: 1px solid var(--line); border-radius: 999px; padding: 7px 15px; cursor: pointer; }
.close { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 20px; }
.nav.prev { left: max(10px, env(safe-area-inset-left, 0px)); }
.nav.next { right: max(10px, env(safe-area-inset-right, 0px)); }
@media (max-width: 640px) { .nav { top: auto; bottom: max(8px, env(safe-area-inset-bottom, 0px)); transform: none; } }
.hint { position: absolute; left: 64px; right: 64px; bottom: max(14px, env(safe-area-inset-bottom, 0px)); margin: 0; text-align: center; color: var(--bone-dim); font-size: 13px; pointer-events: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">Codex · toutes les cartes · <a href="./">retour au jeu</a></span>
    <h1>Eraser <span>Arena</span></h1>
    <p class="lede">Les héros, les dieux et les monstres du monde d'Eraser, chacun en carte. Touche une carte pour l'ouvrir en grand, touche-la encore pour la retourner.</p>
    <div class="facts" id="facts"></div>
  </header>

  <div class="bar" role="search">
    <label class="sr" for="q">Chercher une carte</label>
    <input id="q" type="search" placeholder="Chercher un nom, un titre…" autocomplete="off">
    <label class="sr" for="faction">Faction</label>
    <select id="faction"><option value="">Toutes les factions</option></select>
    <div class="seg" id="rarSeg" role="group" aria-label="Rareté"></div>
    <span class="count" id="count" aria-live="polite"></span>
    <button class="reset" id="reset" type="button" hidden>Tout montrer</button>
  </div>

  <main id="cards"><p class="state">Chargement du Codex…</p></main>

  <footer>
    <span id="source"></span>
    <a href="./">Le jeu</a>
    <a href="atelier/index.html">Atelier des cartes</a>
    <a href="https://github.com/Pink-Rain/Eraser_Arena">Le dépôt</a>
  </footer>
</div>

<dialog id="viewer" aria-label="Carte en grand">
  <div class="stage" id="stage">
    <button class="big" id="big" type="button" aria-pressed="false">
      <span class="face front" id="bigFront"></span>
      <span class="face back" id="bigBack"></span>
    </button>
    <button class="pill close" id="close" type="button">Fermer</button>
    <button class="pill nav prev" id="prev" type="button" aria-label="Carte précédente">‹</button>
    <button class="pill nav next" id="next" type="button" aria-label="Carte suivante">›</button>
    <p class="hint">Touche la carte pour la retourner</p>
  </div>
</dialog>

<script src="atelier/carte/logos.js"></script>
<script src="atelier/carte/silhouettes.js"></script>
<script src="atelier/carte/cadre.js"></script>
<script type="module">
import { carteDe } from './jeu/donnees.js';
(() => {
  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    el.append(...kids.flat().filter((x) => x != null));
    return el;
  };
  const norm = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  const RAR = Cadre.RARITIES;
  const ORDER = [...Cadre.ORDER].reverse(); // de la légendaire à la très commune
  const S = { tags: new Map(), entries: [], q: '', faction: '', rarity: '', shown: [], viewing: -1 };

  // ---------- fiches → cartes (même règle que le jeu) ----------
  const cardOf = (e) => carteDe(S.tags, e);

  // ---------- arbre des factions ----------
  const childrenOf = (id) => [...S.tags.values()].filter((t) => (t.parentId || null) === id).sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name, 'fr'));
  function subtree(id) { const out = new Set([id]); for (const c of childrenOf(id)) for (const x of subtree(c.id)) out.add(x); return out; }
  const inTags = (e, set) => (e.tagIds || []).some((t) => set.has(t));

  function fillFactions() {
    const sel = $('faction');
    const walk = (parent, depth) => {
      for (const t of childrenOf(parent)) {
        const n = S.entries.filter((e) => inTags(e, subtree(t.id))).length;
        if (n) sel.append(h('option', { value: t.id }, '   '.repeat(depth) + t.name + ' (' + n + ')'));
        walk(t.id, depth + 1);
      }
    };
    walk(null, 0);
  }

  function fillRarities() {
    const seg = $('rarSeg'); seg.replaceChildren();
    const present = ORDER.filter((r) => S.entries.some((e) => e.rarity === r));
    for (const r of ['', ...present]) {
      seg.append(h('button', {
        type: 'button', 'aria-pressed': S.rarity === r ? 'true' : 'false',
        onclick: () => { S.rarity = r; fillRarities(); render(); },
      }, r ? h('span', { class: 'dot', style: '--c:' + RAR[r].c }) : null, r ? RAR[r].label : 'Toutes'));
    }
  }

  // ---------- dessin paresseux : une carte n'est peinte qu'en approchant de l'écran ----------
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((list) => {
    for (const it of list) if (it.isIntersecting) { paint(it.target); io.unobserve(it.target); }
  }, { rootMargin: '400px 0px' }) : null;
  function paint(btn) {
    if (btn.firstChild) return;
    const c = Cadre.renderCard(btn._card);
    c.setAttribute('aria-hidden', 'true');
    btn.append(c);
  }

  function render() {
    const q = norm(S.q);
    const fset = S.faction ? subtree(S.faction) : null;
    S.shown = S.entries.filter((e) => {
      if (S.rarity && e.rarity !== S.rarity) return false;
      if (fset && !inTags(e, fset)) return false;
      if (q) {
        const hay = norm([e.title, e.honor, e.description, ...(e.tagIds || []).map((id) => S.tags.get(id)?.name)].join(' '));
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const filtered = !!(S.q || S.faction || S.rarity);
    $('reset').hidden = !filtered;
    $('count').textContent = S.shown.length + (S.shown.length > 1 ? ' cartes' : ' carte');

    const main = $('cards'); main.replaceChildren();
    if (!S.shown.length) { main.append(h('p', { class: 'empty' }, 'Aucune carte ne correspond.')); return; }
    for (const r of ORDER) {
      const list = S.shown.filter((e) => e.rarity === r);
      if (!list.length) continue;
      const grid = h('div', { class: 'grid' });
      for (const e of list) {
        const card = cardOf(e);
        const idx = S.shown.indexOf(e);
        const btn = h('button', {
          class: 'thumb', type: 'button', style: '--glow:' + RAR[r].c + '66',
          'aria-label': card.name + (card.honor ? ', ' + card.honor : '') + ' — ' + RAR[r].label + '. Ouvrir en grand',
          onclick: () => openAt(idx),
        });
        btn._card = card;
        const where = card.faction.short + (card.faction2 ? ' · ' + card.faction2.short : '');
        grid.append(h('div', { class: 'cell' }, btn, h('span', { class: 'cap' }, where)));
        if (io) io.observe(btn); else paint(btn);
      }
      main.append(h('section', { class: 'group', 'aria-label': RAR[r].label },
        h('div', { class: 'group-head', style: '--c:' + RAR[r].c }, h('h2', {}, RAR[r].label), h('span', {}, String(list.length))),
        grid));
    }
  }

  // ---------- carte en grand ----------
  const viewer = $('viewer'), big = $('big');
  function show(i) {
    const n = S.shown.length; if (!n) return;
    S.viewing = (i + n) % n;
    const card = cardOf(S.shown[S.viewing]);
    $('bigFront').replaceChildren(Cadre.renderCard(card));
    $('bigBack').replaceChildren(Cadre.renderBack(card));
    big.setAttribute('aria-pressed', 'false');
    big.setAttribute('aria-label', card.name + ' — retourner la carte');
    $('prev').hidden = $('next').hidden = n < 2;
  }
  function openAt(i) { show(i); if (!viewer.open) viewer.showModal(); big.focus(); }
  big.addEventListener('click', () => big.setAttribute('aria-pressed', big.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'));
  $('close').addEventListener('click', () => viewer.close());
  $('prev').addEventListener('click', () => show(S.viewing - 1));
  $('next').addEventListener('click', () => show(S.viewing + 1));
  $('stage').addEventListener('click', (e) => { if (e.target.id === 'stage') viewer.close(); });
  viewer.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(S.viewing - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); show(S.viewing + 1); }
  });
  // Balayer la carte en grand sur un téléphone pour passer à la voisine.
  let x0 = null;
  big.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  big.addEventListener('touchend', (e) => {
    if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) { e.preventDefault(); show(S.viewing + (dx < 0 ? 1 : -1)); }
  });

  // ---------- filtres ----------
  let qt;
  $('q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 120); });
  $('faction').addEventListener('change', (e) => { S.faction = e.target.value; render(); });
  $('reset').addEventListener('click', () => { S.q = S.faction = S.rarity = ''; $('q').value = ''; $('faction').value = ''; fillRarities(); render(); });

  // ---------- chargement ----------
  (async () => {
    try {
      const res = await fetch('data/codex.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      for (const t of data.tags) S.tags.set(t.id, t);
      S.entries = data.entries.filter((e) => e.kind !== 'note');
      try {
        await Promise.all(['700 26px "Cinzel"', '600 15px "Cinzel"', '500 19px "Alegreya Sans"', '600 15px "Alegreya Sans"', 'italic 17px "Alegreya"']
          .map((f) => document.fonts.load(f)));
      } catch (_) {}
      const factions = new Set(S.entries.flatMap((e) => e.tagIds || [])).size;
      $('facts').replaceChildren(
        h('span', {}, h('b', {}, String(S.entries.length)), ' cartes'),
        h('span', {}, h('b', {}, String(factions)), ' factions'),
        h('span', {}, h('b', {}, String(ORDER.filter((r) => S.entries.some((e) => e.rarity === r)).length)), ' raretés'));
      if (data.exportedAt) {
        const d = new Date(data.exportedAt + 'T12:00:00');
        $('source').textContent = 'Fiches tirées du Codex d\'Eraser le ' + d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
      }
      fillFactions(); fillRarities(); render();
    } catch (err) {
      $('cards').replaceChildren(h('p', { class: 'state' },
        'Le Codex n\'a pas pu être chargé. Ouvert directement depuis le disque, la page ne peut pas lire data/codex.json : lance un petit serveur (python3 -m http.server) ou ouvre la page GitHub.'));
      console.error(err);
    }
  })();
})();
</script>
</body>
</html>

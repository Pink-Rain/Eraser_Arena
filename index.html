<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eraser Arena</title>
<meta name="description" content="Eraser Arena : ouvre des paquets, collectionne les héros, les dieux et les monstres du monde d'Eraser.">
<meta name="theme-color" content="#141114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Cinzel:wght@600;700&family=Alegreya:ital@1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="haut">
  <a class="marque" href="#accueil">Eraser <span>Arena</span></a>
  <a class="chip-admin" href="#profil" id="chipAdmin" hidden>Admin</a>
  <nav class="onglets" aria-label="Menu">
    <a class="onglet" href="#accueil" data-ecran="accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>Accueil</span>
    </a>
    <a class="onglet" href="#paquets" data-ecran="paquets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6z"/><path d="M6 6.5l1.5-1.5L9 6.5l1.5-1.5L12 6.5l1.5-1.5L15 6.5l1.5-1.5L18 6.5"/><circle cx="12" cy="13" r="3"/></svg>
      <span>Paquets</span><span class="pastille" id="pastillePaquets" hidden></span>
    </a>
    <a class="onglet" href="#collection" data-ecran="collection">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="8" height="12" rx="1.5" transform="rotate(-8 7 11)"/><rect x="11" y="6" width="9" height="13" rx="1.5"/></svg>
      <span>Collection</span>
    </a>
    <a class="onglet" href="#combat" data-ecran="combat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l10 10M4 4v4M4 4h4"/><path d="M20 4 10 14M20 4v4M20 4h-4"/><path d="M8 16l-3 3M16 16l3 3M7 13l4 4M17 13l-4 4"/></svg>
      <span>Combat</span><span class="bientot">bientôt</span>
    </a>
    <a class="onglet" href="#profil" data-ecran="profil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Profil</span>
    </a>
  </nav>
  <a class="lien-codex" href="codex.html">Codex ↗</a>
</header>

<main id="ecran"><p class="etat">Chargement…</p></main>

<dialog id="visionneuse" aria-label="Carte en grand">
  <div class="plateau" id="plateau">
    <button class="grande" id="grande" type="button" aria-pressed="false">
      <span class="face devant" id="devant"></span>
      <span class="face arriere" id="arriere"></span>
    </button>
    <button class="pilule fermer" id="fermer" type="button">Fermer</button>
    <button class="pilule nav prec" id="prec" type="button" aria-label="Carte précédente">‹</button>
    <button class="pilule nav suiv" id="suiv" type="button" aria-label="Carte suivante">›</button>
    <p class="aide">Touche la carte pour la retourner</p>
  </div>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="atelier/carte/logos.js"></script>
<script src="atelier/carte/silhouettes.js"></script>
<script src="atelier/carte/cadre.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

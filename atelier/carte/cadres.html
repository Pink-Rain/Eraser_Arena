<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadres des cartes</title>
<style>
  body { margin: 0; background: #121014; color: #e6dccb; font: 15px/1.5 system-ui, sans-serif; padding: 20px 16px 40px; }
  h1 { font: 700 24px Georgia, serif; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 22px 16px; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
  figure canvas { width: 100%; max-width: 320px; height: auto; }
  figcaption { color: #a99e90; }
</style>
</head>
<body>
<h1>Cadres des cartes</h1>
<div class="grid" id="grid"></div>
<script src="cadre.js"></script>
<script src="factions.js"></script>
<script>
  const q = new URLSearchParams(location.search); const only = q.get('only') ? q.get('only').split(',') : null;
  for (const key of Cadre.ORDER) {
    if (only && !only.includes(key)) continue;
    const fig = document.createElement('figure'); const cap = document.createElement('figcaption');
    cap.textContent = Cadre.RARITIES[key].label; fig.append(Cadre.renderFrame(key, FACTIONS.find((f) => f.id === (q.get('faction') || 'orques-sang'))), cap); document.getElementById('grid').append(fig);
  }
  document.title = 'done';
</script>
</body>
</html>

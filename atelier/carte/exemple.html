<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte d'exemple</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya:ital@1&family=Alegreya+Sans:wght@400;500;600&display=swap">
<style>
  body { margin: 0; background: #121014; padding: 20px; }
  figure { margin: 0; } canvas { width: 512px; height: auto; }
</style>
</head>
<body>
<figure id="f"></figure>
<script src="cadre.js"></script>
<script src="factions.js"></script>
<script>
  (async () => {
    try { await Promise.all([document.fonts.load('700 24px "Cinzel"'), document.fonts.load('500 19px "Alegreya Sans"'), document.fonts.load('600 13px "Alegreya Sans"'), document.fonts.load('italic 17px "Alegreya"')]); } catch (e) {}
    const q = new URLSearchParams(location.search);
    const card = { name: 'Khim Tay', rarity: q.get('r') || 'legendaire', faction: FACTIONS.find((f) => f.id === 'les-neuf'), category: 'Personnage · Les Neuf', ability: 'Blablabla.', flavor: 'Blou blou blou.', attack: 3, life: 5 };
    document.getElementById('f').append(Cadre.renderCard(card));
    document.title = 'done';
  })();
</script>
</body>
</html>
